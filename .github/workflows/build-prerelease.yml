name: Build and Pre-Release
on:
  push:
    tags:
      - 'rc-v*'
permissions:
  contents: write
  packages: write
jobs:
  build:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Build commands never publish; the release step owns publishing.
      - name: Build for macOS
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Prepare macOS artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION=${GITHUB_REF#refs/tags/rc-v}
          echo "Version: $VERSION"

          for dmg in release/*.dmg; do
            if [ -f "$dmg" ]; then
              zip "artifacts/reverb-${VERSION}-rc-macOS.zip" "$dmg" README.md
              echo "Created reverb-${VERSION}-rc-macOS.zip"
            fi
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: artifacts/
  release:
    name: Create Pre-Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: List downloaded files
        run: find . -type f | sort
      - name: Create Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          files: macos-artifacts/*
          draft: false
          prerelease: true
          name: 'Pre-Release ${{ github.ref_name }}'
          body: |
            Experimental pre-release build.

            **This is a test build — not for production use.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
