name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and update
        required: true
        default: v2.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate release
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion."
          }
          gh release view $env:RELEASE_TAG
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run build:win
      - name: Locate Windows installer
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)."
          }
          "path=$($installers[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
      - name: Attach installer to release
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: gh release upload $env:RELEASE_TAG $env:INSTALLER_PATH --clobber
