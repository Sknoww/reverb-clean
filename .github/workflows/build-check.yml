name: Build Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-check:
    name: Build Check (macOS)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
